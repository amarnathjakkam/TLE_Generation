<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>TLE Pass Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="styles.css" rel="stylesheet" />
  <!-- Libraries (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.1/dist/satellite.min.js" defer
    crossorigin="anonymous"></script>
  <!-- <script src="satellite_5.min.js"  ></script> -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer crossorigin="anonymous"></script>
  <!-- App -->
  <script src="app.js" defer></script>
</head>

<body>
  <div class="container">
    <!-- LEFT: inputs -->
    <section class="left">
      <h1>TLE Pass Generator</h1>

      <div class="card">
        <h2>TLE</h2>
        <div class="grid-1-2">
          <label>
            Name
            <input id="tleName" type="text" value="EM1" />
          </label>
          <div></div>
          <label class="full">
            Line 1
            <input id="tleL1" type="text"
              value="1 44078U 19072A   25237.00127315  .00000014  00000-0  40313-4 0  1239" />
          </label>
          <label class="full">
            Line 2
            <input id="tleL2" type="text"
              value="2 44078  98.2808 291.9629 0018719  34.1424  38.1671 14.43768520337337" />
          </label>
        </div>

        <!-- File loader for one or multiple named TLEs -->
        <div class="row gap" style="margin-top:8px;">
          <input id="tleFile" type="file" accept=".txt,.tle" />
          <button id="loadTleBtn" type="button">Load from File</button>
          <!-- Picker that fills the fields above -->
          <select id="tlePicker" class="hidden" title="Select a TLE to fill the fields"></select>
        </div>
      </div>

      <div class="card">
        <h2>Observer</h2>
        <div class="grid-3">
          <label>
            Latitude (°)
            <input id="obsLat" type="number" step="0.000001" value="17.268660" />
          </label>
          <label>
            Longitude (°)
            <input id="obsLon" type="number" step="0.000001" value="78.496172" />
          </label>
          <label>
            Altitude (m)
            <input id="obsAltM" type="number" step="0.1" value="0" />
          </label>
        </div>
      </div>

      <div class="card">
        <h2>Time Range</h2>
        <div class="grid-2">
          <label>
            Start (UTC)
            <input id="startTime" type="datetime" step="1"/>
          </label>
          <label>
            End (UTC)
            <input id="endTime" type="datetime" step="1"/>
          </label>
        </div>
        <div class="grid-3">
          <label>
            Resolution (ms, ×100)
            <input id="resolutionMs" type="number" min="100" step="100" value="1000" />
          </label>
          <label>
            Decimals
            <input id="decimals" type="number" min="0" max="6" step="1" value="2" />
          </label>
          <label>
            Temperature (°C)
            <input id="tempC" type="number" step="0.1" value="15" />
          </label>
        </div>
        <div class="grid-3">
          <label class="checkbox">
            <input id="applyRefraction" type="checkbox" checked />
            Apply Refraction
          </label>
          <label>
            Tilt Angle (°)
            <input id="tiltDeg" type="number" step="0.01" value="0" />
          </label>
          <label>
            Tilt Azimuth (°)
            <input id="tiltAzDeg" type="number" step="0.01" value="0" />
          </label>
        </div>

        <!-- Generation mode -->
        <div class="row gap" style="margin-top:6px;">
          <label class="rows">
            Generate:
            <select id="whichTles">
              <option value="current" selected>Current fields only</option>
              <option value="specific">Specific TLE from file</option>
              <option value="all">All TLEs from file</option>
            </select>
          </label>
          <label class="rows">
            TLE:
            <select id="whichTleFromFile" class="hidden" title="Pick a TLE from the loaded file"></select>
          </label>
          <label class="rows">
            Min El (°)
            <input id="minElFilter" type="number" step="0.05" value="0.05" min="0" style="width:80px;" />
          </label>
        </div>

        <div class="button-bar">
          <button id="generateBtn">🚀 Generate</button>
          <button id="downloadAllBtn" disabled>⬇ Download All CSV</button>
        </div>

        <div id="progressWrap" class="progress hidden" aria-hidden="true">
          <div id="progressBar"></div>
        </div>
      </div>
    </section>

    <!-- RIGHT: Common grouped summary -->
    <section class="right">
      <div class="card">
        <div class="row between" style="margin-bottom:8px;">
          <h2>Grouped Passes (Az&gt;0 &amp; El&gt;0)</h2>
          <div class="row gap">
            <div id="groupCountLabel" class="muted"></div>
            <button id="downloadGroupsZipBtn" disabled>⬇ Download Groups ZIP</button>
          </div>
        </div>

        <table id="groupTable" class="hidden">
          <thead>
            <tr>
              <th>#</th>
              <th>TLE</th>
              <th>Start (UTC)</th>
              <th>End (UTC)</th>
              <th>Min El (°)</th>
              <th>Max El (°)</th>
              <th>Start Az (°)</th>
              <th>End Az (°)</th>
              <th>Samples</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="noGroupsMsg" class="muted hidden">No groups found for Az&gt;0 and El&gt;0 in the selected range.</p>
      </div>
    </section>
  </div>

  <!-- Modal for group details WITH PAGINATION -->
  <div id="groupModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="groupTitle">Group Details</h3>
        <button id="closeModal" class="close-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-controls">
          <div class="row gap">
            <button id="modalFirstBtn">⏮ First</button>
            <button id="modalPrevBtn">Prev</button>
            <button id="modalNextBtn">Next</button>
            <button id="modalLastBtn">Last ⏭</button>
          </div>
          <div id="modalPageInfo" class="muted">Page 0/0 • 0 rows</div>
          <label class="rows">
            Rows/page
            <select id="modalRowsPerPage">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <div class="grow"></div>
          <button id="downloadGroupCsv">⬇ Download Group CSV</button>
        </div>

        <table id="groupDetailsTable">
          <thead>
            <tr>
              <th>Time (UTC)</th>
              <th>Az (°)</th>
              <th>El (°)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="modal-backdrop" aria-hidden="true"></div>
  </div>
</body>

</html>
